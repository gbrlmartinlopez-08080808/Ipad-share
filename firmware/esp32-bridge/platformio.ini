; iPad Share USB bridge firmware (ESP32-S3 with native USB).
; Build:  pio run           Flash:  pio run -t upload
; Or flash the released merged .bin from a browser with https://espressif.github.io/esptool-js/

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
build_flags =
    -DARDUINO_USB_MODE=1          ; native USB-Serial/JTAG (shows up as VID 303A)
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
